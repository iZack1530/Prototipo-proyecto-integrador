<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a17">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Ruta no encontrada — Horizon Mythos</title>
  <style>
    :root{color-scheme:dark;--fondo:#111a17;--panel:#18231e;--texto:#f0eee4;--suave:#a8b1a6;--acento:#d7a85f;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-width:320px;min-height:100vh;margin:0;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 70% 45%,rgba(77,99,72,.19),transparent 42%),var(--fondo);color:var(--texto);line-height:1.6}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--acento);outline-offset:4px}
    .cabecera,.pie{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem max(6.7vw,calc((100vw - 1100px)/2));border-bottom:1px solid rgba(240,238,228,.13)}
    .marca{display:flex;align-items:center;gap:.7rem;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
    .marca-simbolo{display:grid;width:2rem;height:2rem;place-items:center;border:1px solid var(--acento);color:var(--acento);font:1.3rem Georgia,serif}
    .marca-texto span{color:#ebc88e;font-weight:400}
    .volver{color:#ebc88e;font-size:.8rem}
    main{width:min(720px,calc(100% - 2.5rem));align-self:center;margin:5rem auto;padding:clamp(2rem,7vw,5rem);border:1px solid rgba(240,238,228,.13);background:rgba(24,35,30,.72)}
    .codigo{margin:0 0 .4rem;color:var(--acento);font-size:.7rem;font-weight:600;letter-spacing:.2em}
    h1{margin:0 0 1rem;font:clamp(2.7rem,8vw,5rem)/1 Georgia,"Times New Roman",serif;letter-spacing:-.05em}
    p{max-width:460px;margin:0 0 2rem;color:var(--suave);font-size:.9rem}
    .acciones{display:flex;flex-wrap:wrap;gap:.8rem}
    .boton{display:inline-flex;min-height:3rem;align-items:center;gap:.8rem;padding:.7rem 1rem;background:var(--acento);color:#172019;font-size:.8rem;font-weight:600}
    .boton-secundario{border:1px solid rgba(240,238,228,.2);background:transparent;color:var(--texto)}
    .pie{border-top:1px solid rgba(240,238,228,.13);border-bottom:0;color:var(--suave);font-size:.73rem}
    .pie p{margin:0;font:italic .9rem Georgia,serif}
    @media(max-width:600px){.cabecera,.pie{align-items:flex-start;padding:1rem 1.2rem}.pie{flex-direction:column}main{margin:2.5rem auto;padding:2rem 1.4rem}}
  </style>
</head>
<body>
  <header class="cabecera">
    <a class="marca" data-destino="index.html" href="./index.html" aria-label="Horizon Mythos, inicio">
      <span class="marca-simbolo" aria-hidden="true">H</span>
      <span class="marca-texto">Horizon <span>Mythos</span></span>
    </a>
    <a class="volver" data-destino="index.html" href="./index.html">Volver al inicio <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <p class="codigo">ERROR 404 · CAMINO INTERRUMPIDO</p>
    <h1>Este horizonte<br>no existe.</h1>
    <p>La ruta que buscas no está disponible o cambió de lugar. Vuelve al inicio o continúa hacia el Laboratorio.</p>
    <nav class="acciones" aria-label="Rutas disponibles">
      <a class="boton" data-destino="index.html" href="./index.html">Ir al inicio <span aria-hidden="true">→</span></a>
      <a class="boton boton-secundario" data-destino="laboratorio/" href="./laboratorio/">Abrir Laboratorio</a>
    </nav>
  </main>
  <footer class="pie">
    <span>Horizon Mythos</span>
    <p>Un horizonte nuevo en cada encuentro.</p>
  </footer>
  <script>
    (function () {
      var base = "/";
      var segmentos = window.location.pathname.split("/").filter(Boolean);
      var host = window.location.hostname.toLowerCase();
      var repo = "prototipo-proyecto-integrador";

      if (window.location.protocol === "file:") {
        base = "./";
      } else if (host.endsWith(".github.io")) {
        if (segmentos[0] && (host !== "izack1530.github.io" || segmentos[0].toLowerCase() === repo)) {
          base = "/" + segmentos[0] + "/";
        }
      }

      document.querySelectorAll("[data-destino]").forEach(function (enlace) {
        enlace.href = base + enlace.getAttribute("data-destino");
      });
    }());
  </script>
</body>
</html>
