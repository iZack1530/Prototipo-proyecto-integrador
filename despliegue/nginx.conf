map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_horizon {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # No exponer dotfiles (.git, .env), código fuente ni la propia configuración.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ^~ /despliegue/ { deny all; }
    location ^~ /src/ { deny all; }
    location ^~ /pruebas/ { deny all; }
    location ^~ /herramientas/ { deny all; }
    location ^~ /archivo/ { deny all; }
    location ^~ /.github/ { deny all; }
    location ~* \.(csproj|sln|md)$ { deny all; }

    # Laboratorio interno: equipo con credenciales básicas.
    # Crear despliegue/auth/htpasswd con: htpasswd -c despliegue/auth/htpasswd equipo
    location ^~ /laboratorio/ {
        auth_basic "Laboratorio interno";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        root /var/www/horizon;
        try_files $uri $uri/ /laboratorio/index.html;
    }

    location /api/ {
        proxy_pass http://api_horizon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR: WebSocket necesita Upgrade y sin buffer.
    location /hub/ {
        proxy_pass http://api_horizon;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        alias /var/www/media/;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /404.html {
        root /var/www/horizon;
        internal;
    }

    location / {
        root /var/www/horizon;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
    }
}

# HTTPS: copia nginx-ssl.conf.ejemplo a conf.d y ajusta el dominio cuando
# certbot haya emitido el certificado. El bloque HTTP de arriba puede seguir
# sirviendo /api/ y /hub/ para pruebas locales.
