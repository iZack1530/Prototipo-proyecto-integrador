name: integracion

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore HorizonMythos.sln

      - name: Compilar
        run: dotnet build HorizonMythos.sln --no-restore --configuration Release

      - name: Probar
        run: dotnet test HorizonMythos.sln --no-build --configuration Release --verbosity normal
